# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
---
name: "CodeQL"

on: # yamllint disable-line rule:truthy
  push:
    branches: [main, release-*]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main, release-*]
  schedule:
    - cron: "15 19 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["java", "javascript"]
        # CodeQL supports ['cpp', 'csharp', 'go', 'java', 'javascript', 'python']
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Initializes the CodeQL tools for scanning.
      - name: Configure Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          # queries: ./path/to/local/query, your-org/your-repo/queries@main

      # Build Java manually so the Maven version used for CodeQL extraction is pinned.
      - name: Autobuild
        if: matrix.language == 'java'
        env:
          MAVEN_VERSION: "3.9.12"
        shell: bash
        run: |
          archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          base_url="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries"
          curl --fail --location --show-error --silent "${base_url}/${archive}" -o "${archive}"
          curl --fail --location --show-error --silent "${base_url}/${archive}.sha512" -o "${archive}.sha512"
          echo "$(tr -d '\n' < "${archive}.sha512")  ${archive}" | sha512sum --check --status -
          tar --extract --gzip --file "${archive}"
          "${GITHUB_WORKSPACE}/apache-maven-${MAVEN_VERSION}/bin/mvn" -B -e -ntp package -DskipTests

      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 https://git.io/JvXDl

      # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
      #    and modify them (or add more) to build your code if your project
      #    uses a compiled language

      # - run: |
      #   make bootstrap
      #   make release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
