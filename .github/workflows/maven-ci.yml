---
name: "Maven: CI Builds"

on: # yamllint disable-line rule:truthy
  push:
    branches: [main, release/**, patch/**]
  pull_request:
    branches: [main, release/**, patch/**]

permissions:
  contents: read

jobs:
  build:
    name: RHEL8 standard build on Java 11 with compiler target 11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        run: |
          docker compose -f contrib/docker/docker-compose.ci.yml up --exit-code-from emissary-ci
          docker compose -f contrib/docker/docker-compose.ci.yml down

  matrix-build:
    name: RHEL8 experimental build on Java ${{ matrix.java-version }} with compiler target ${{ matrix.java-compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-compiler: ['11', '17']
        java-version: ['21']
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          file: contrib/docker/Dockerfile
          build-args: |
            java_version=${{ matrix.java-version }}
            java_compiler=${{ matrix.java-compiler }}
            verify_build=false
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

  centos7-build:
    name: Centos7 legacy build on Java 11 with compiler target 11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          file: contrib/docker/Dockerfile
          build-args: |
            target_os=centos7
            verify_build=false
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

  macos-build:
    name: MacOS non-standard build on Java 21 with compiler target 11
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'corretto'
          overwrite-settings: false

      - name: Build with Maven
        run: mvn -B -e -ntp "-Dstyle.color=always" clean verify -Pdist

  site-build:
    name: Maven site build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Java & Maven
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 11
          distribution: "corretto"

      - name: Build with Maven
        run: mvn -B -e -ntp "-Dstyle.color=always" site -Pcoverage,pmd

  slack-notify:
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'NationalSecurityAgency/emissary' }}
    needs: [build, matrix-build, centos7-build, macos-build, site-build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Gather job results
        id: job-results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jobs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --paginate --jq '[.jobs[] | select(.name != "slack-notify")]')

          fields=$(jq -c '
            map(
              (if .conclusion == "success" then "✅"
               elif .conclusion == "failure" then "❌"
               elif .conclusion == "cancelled" then "⚠️"
               elif .conclusion == "skipped" then "⏭️"
               else "❓" end) as $emoji
              | {
                  type: "mrkdwn",
                  text: ($emoji + " *" + .name + "*" + (if .conclusion != "success" then "\n<" + .html_url + "|View logs>" else "" end))
                }
            )
          ' <<< "$jobs_json")

          echo "fields=$fields" >> "$GITHUB_OUTPUT"

      - name: Publish to slack channel via bot token
        id: slack
        env:
          CI_RESULT: ${{ contains(needs.*.result, 'failure') && 'Failed ❌' || 'Passed ✅' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-templated: true
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "emissary (${{ github.ref_name }}) -- CI ${{ env.CI_RESULT }}",
              "unfurl_links": false,
              "unfurl_media": false,
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*emissary* (`${{ github.ref_name }}`) -- CI ${{ env.CI_RESULT }}\nCommit: <${{ github.event.head_commit.url }}|${{ github.sha }}> by ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View full run>"
                  }
                },
                {
                  "type": "section",
                  "fields": ${{ steps.job-results.outputs.fields }}
                }
              ]
            }
