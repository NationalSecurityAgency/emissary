# -----------------------------------------------------------------------------
# Sink settings
# -----------------------------------------------------------------------------

# Each rolling sink owns a separate journal directory.
# @{OUTPUT_ROOT} is the configured local output root (emissary.output.root).
OUTPUT_PATH = "@{OUTPUT_ROOT}/json"

# -----------------------------------------------------------------------------
# Output policy
# -----------------------------------------------------------------------------

# This sink uses one policy. It decides what is written for
# each payload, view, parameter key, and parameter value. Rules run in order and
# the first match wins; if nothing matches, POLICY_DEFAULT applies. Startup and
# trace responses name the rule that made each decision.

# Outcome when no rule matches: "allow" (default) or "deny".
#POLICY_DEFAULT = "allow"

# Skip records already marked not outputable. Remove this rule to ignore the flag.
POLICY_STAGE = "rule deny payload outputable=false"

# Grammar and wildcard behavior are documented in emissary.output.policy.
# Separate POLICY_STAGE entries are evaluated in file order.
#POLICY_STAGE = "rule deny payload filetype=EXE,PDF"
#POLICY_STAGE = "rule deny view JSON_ML"
#POLICY_STAGE = "rule deny param PRIVATE_*"
#POLICY_STAGE = "rule deny value EMAIL=*@example.com"

# Custom stages use the same policy and read this same file for their settings.
#POLICY_STAGE = "filter com.example.MyOutputFilter"

# EMIT controls the shape of the output:
#   both       content and metadata (default)
#   metadata   metadata only; payload and views are omitted
#   content    content only; parameters are omitted
#EMIT = "both"

# -----------------------------------------------------------------------------
# Rolling output
# -----------------------------------------------------------------------------

#MAX_FILE_SIZE = "250m"
#MAX_OUTPUT_APPENDERS = "16"
#ROLL_INTERVAL_UNIT = "MINUTES"
#ENABLE_OBJECT_TRACE = "false"

# Remove a prefix from parameter names before writing them.
#STRIP_PARAM_PREFIX = "APP_"
