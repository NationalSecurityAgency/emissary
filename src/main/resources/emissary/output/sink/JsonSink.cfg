# -----------------------------------------------------------------------------
# Sink settings
# -----------------------------------------------------------------------------

# The JSON file name generator is fixed at ".json" and does not include the sink
# name, so each JSON output needs its own directory. @{OUTPUT_ROOT} is the
# configured local output root (emissary.output.root).
OUTPUT_PATH = "@{OUTPUT_ROOT}/json"

# -----------------------------------------------------------------------------
# Whole-payload eligibility (sinks only)
# -----------------------------------------------------------------------------

# Only the sink can accept or reject an entire payload (before any serialization
# happens). Initialized from these entries; see emissary.output.filter.IFilterCondition.
#PAYLOAD_FILTER = "emissary.output.sink.filter.PayloadFilterCondition"
#DENY_FILETYPES = "PDF, EXE"
#DENY_FORMS = "UNKNOWN"

# -----------------------------------------------------------------------------
# Formatter output filters (JsonFormatter)
# -----------------------------------------------------------------------------

# Filters decide per parameter and per view, ANDed in declared order. Configure
# nothing to output everything.
#
#   OUTPUT_FILTER = "emissary.output.formatter.filter.FilterOutput"
#
# FilterOutput is the list filter. FILTER_MODE sets the polarity:
#
#   FILTER_MODE = "deny"    lists DROP what is listed, everything else passes (default)
#   FILTER_MODE = "allow"   lists are the ONLY things output (whitelist)
#
# List keys:
#   VIEWS          view names, optional "filetype." prefix, optional trailing "*"
#   PARAMS         parameter names, optional trailing "*", or "*" for all
#   PARAM_VALUE_   specific values, honoring FILTER_MODE: denied in "deny",
#                only-emitted in "allow":  PARAM_VALUE_<KEY> = "v1, v2"
#
# View list entry format is protected by:
#   VIEW_NAME_CHARS    character class allowed in view/filetype names
#   FILETYPE_FORMAT    regex for the filetype half of an entry
#   VIEW_NAME_FORMAT   regex for the view-name half of an entry

# Example: drop specific views and parameters (deny postures)
#OUTPUT_FILTER = "emissary.output.formatter.filter.FilterOutput"
#FILTER_MODE = "deny"
#VIEWS = "JSON_ML, JSON_LANG_*"
#PARAMS = "FOO, PRIVATE_*"

# Example: emit only the listed views and parameters (whitelist)
#OUTPUT_FILTER = "emissary.output.formatter.filter.FilterOutput"
#FILTER_MODE = "allow"
#VIEWS = "JSON_*, XML.JSON_1_0"
#PARAMS = "FOO, RFC822_HEADER"

# Example: drop specific parameter values (deny mode)
#PARAM_VALUE_EMAIL = "boss@example.com, admin@example.com"
# In "allow" mode the same entry emits ONLY those values for the key.

# EMIT suppresses a whole dimension via an installed-first FilterEmit:
#   EMIT = "both"       metadata parameters AND payload/views (default)
#   EMIT = "metadata"    metadata parameters only (metadata-only output)
#   EMIT = "content"     payload/views only

# Extra custom filter classes can be layered onto OUTPUT_FILTER; each entry is a
# fully qualified class extending emissary.output.formatter.filter.AbstractItemFilter.
#OUTPUT_FILTER = "emissary.output.formatter.filter.FilterMaxViewSize"
#CONTENT_MAX_VIEW_SIZE = "10m"
#OUTPUT_FILTER = "emissary.output.formatter.filter.FilterRequiredField"
#CONTENT_REQUIRED_FIELDS = "RFC822_HEADER"
#OUTPUT_FILTER = "emissary.output.formatter.filter.FilterMaxValueSize"
#METADATA_MAX_VALUE_SIZE = "4096"
#OUTPUT_FILTER = "emissary.output.formatter.filter.FilterFieldPattern"
#METADATA_FIELD_PATTERN = ".*"

# Strip a prefix from parameter names before they are output. Matching is done
# on the stripped name.
#STRIP_PARAM_PREFIX = "APP_"