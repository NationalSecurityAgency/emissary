# -----------------------------------------------------------------------------
# Sink settings
# -----------------------------------------------------------------------------

# The JSON file name generator is fixed at ".json" and does not include the sink
# name, so each JSON output needs its own directory. @{OUTPUT_ROOT} is the
# configured local output root (emissary.output.root).
OUTPUT_PATH = "@{OUTPUT_ROOT}/json"

ENABLE_OBJECT_TRACE = "true"

# -----------------------------------------------------------------------------
# Payload (whole-payload) filters
# -----------------------------------------------------------------------------
# Whole-payload eligibility is decided by IFilterCondition classes declared under
# PAYLOAD_FILTER (each entry a class or name:class). They are instantiated via
# Factory and ANDed together in declared order; everything is allowed unless a
# filter denies it. With no PAYLOAD_FILTER entry the default deny-first
# PayloadFilterCondition is applied.
#
# Payload filter catalog (emissary.output.sink.filter.*):
#   PayloadFilterCondition   deny payloads     - DENY_FILETYPES = "type,..."
#                                                DENY_FORMS = "form,..."
#   MaxChildrenFilter        deny big families - MAX_CHILDREN = "n"
#PAYLOAD_FILTER = "emissary.output.sink.filter.PayloadFilterCondition"
#PAYLOAD_FILTER = "emissary.output.sink.filter.MaxChildrenFilter"
#MAX_CHILDREN = "100"
#DENY_FILETYPES = "JSON_RARE"

# -----------------------------------------------------------------------------
# Formatter settings (JsonFormatter)
# -----------------------------------------------------------------------------
# Every filter - including the allow/deny list filters - is declared as a fully
# qualified filter class under CONTENT_FILTER (for views) or METADATA_FILTER (for
# parameters). Filters are instantiated via Factory and ANDed onto the chain in the
# order declared; an empty chain allows everything.
#
# Shared list-parsing keys (apply to ContentDenyFilter/ContentAllowFilter):
#   DENYLIST_ALLOWED_NAME_CHARS  character class allowed in view/filetype names
#   DENYLIST_FILETYPE_FORMAT     regex for the filetype half of an entry
#   DENYLIST_VIEW_NAME_FORMAT    regex for the view-name half of an entry
#
# Content filter catalog (emissary.output.formatter.filter.content.*):
#   ContentDenyFilter          deny views        - DENYLIST = "view pattern,..."
#   ContentAllowFilter         allow views       - ALLOWLIST = "view pattern,..."
#   sample.ContentRequiredFieldFilter  require views for listed params
#                                       - CONTENT_REQUIRED_FIELDS = "FIELD,..."
#   sample.ContentBinaryViewFilter     reject binary views
#                                       - CONTENT_REJECT_BINARY_VIEWS, see below
#   sample.ContentMaxViewSizeFilter    reject oversized views
#                                       - CONTENT_MAX_VIEW_SIZE = "n"
#
# Metadata filter catalog (emissary.output.formatter.filter.metadata.*):
#   MetadataDenyFilter         deny params       - DENYLIST_FIELD = "param,..."
#   MetadataAllowFilter        allow params      - ALLOWLIST_FIELD = "param,..."
#   MetadataFieldPatternFilter (sample) keep params matching a regex
#                                       - METADATA_FIELD_PATTERN = "..."
#   MetadataMaxValueSizeFilter (sample) drop params with oversized values
#                                       - METADATA_MAX_VALUE_SIZE = "n"
#   STRIP_PARAM_PREFIX = "prefix,..." (shared; a prefix is stripped before matching)

# --- deny specific views; accept everything unless denied --------------------
