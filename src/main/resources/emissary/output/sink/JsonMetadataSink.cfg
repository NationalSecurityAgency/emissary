# -----------------------------------------------------------------------------
# Sink settings
# -----------------------------------------------------------------------------

# The JSON file name generator is fixed at ".json" and does not include the sink
# name, so each JSON output needs its own directory. @{OUTPUT_ROOT} is the
# configured local output root (emissary.output.root).
OUTPUT_PATH = "@{OUTPUT_ROOT}/jsonm"

# -----------------------------------------------------------------------------
# Formatter settings (JsonFormatter)
# -----------------------------------------------------------------------------

# Deny every view, producing metadata-only output.
CONTENT_FILTER = "emissary.output.formatter.filter.content.ContentDenyFilter"
DENYLIST = "*"

# --- drop specific metadata parameters on top of the metadata-only output -----
#METADATA_FILTER = "emissary.output.formatter.filter.metadata.MetadataDenyFilter"
#DENYLIST_FIELD = "FOO"