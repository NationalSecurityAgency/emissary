# -----------------------------------------------------------------------------
# Sink settings
# -----------------------------------------------------------------------------

# Each rolling sink owns a separate journal directory.
# @{OUTPUT_ROOT} is the configured local output root.
OUTPUT_PATH = "@{OUTPUT_ROOT}/jsonm"

# -----------------------------------------------------------------------------
# Output policy
# -----------------------------------------------------------------------------

# Skip records already marked not outputable. Remove this rule to ignore the flag.
POLICY_STAGE = "rule deny payload outputable=false"

# Write one record per payload with metadata parameters only.
EMIT = "metadata"

# Add policy rules to narrow the output further; see emissary.output.policy.
#POLICY_STAGE = "rule deny param FOO"
