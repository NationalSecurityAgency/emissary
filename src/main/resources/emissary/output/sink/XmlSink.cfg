# -----------------------------------------------------------------------------
# Sink settings
# -----------------------------------------------------------------------------

# @{OUTPUT_ROOT} is the configured local output root.
OUTPUT_PATH = "@{OUTPUT_ROOT}/xml"

# -----------------------------------------------------------------------------
# Output policy
# -----------------------------------------------------------------------------

# Skip records already marked not outputable. Remove this rule to ignore the flag.
POLICY_STAGE = "rule deny payload outputable=false"

# XML uses the same policy grammar and EMIT options as JSON sinks.
#EMIT = "metadata"
