SERVICE_KEY = "*.OUTPUT_DISPATCH.IO.@{emissary.node.scheme}://@{emissary.node.name}:@{emissary.node.port}/OutputDispatchPlace$9990"

SYNCHRONIZED_PROCESS = "false"
FAILURE_TERMINATES_CHAIN = "false"

UNIX_ROOT = "@{TMPDIR}/data/OutputData"

OUTPUT_DATA = "@{UNIX_ROOT}"

# Sinks start in listed order. Use NAME:CLASS to give a sink a custom name.
# Labels identify destinations; each sink reads its standard class configuration.
OUTPUT_SINK = "emissary.output.sink.JsonSink"
OUTPUT_SINK = "emissary.output.sink.JsonMetadataSink"

IMPORT_FILE = "emissary.output.DropOffUtil.cfg"
